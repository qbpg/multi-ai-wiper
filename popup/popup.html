<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=420, initial-scale=1.0" />
  <title>WIPER</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Header -->
  <header class="mw-header">
    <div class="mw-title">WIPER <span class="mw-version">// v1.0</span></div>
    <span id="platform-badge" class="mw-platform-tag">NO PLATFORM</span>
  </header>

  <!-- Status bar -->
  <div class="mw-status">
    <div>
      <span id="status-dot" class="mw-status-dot"></span>
      <span id="status-text">Initializing...</span>
    </div>
    <span id="chat-count" class="mw-count"></span>
  </div>

  <!-- Scan button -->
  <div class="mw-scan-row">
    <button id="btn-scan" class="mw-btn-scan">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      SCAN CHATS
    </button>
  </div>

  <!-- Search -->
  <div class="mw-search-row">
    <input type="text" id="search-input" placeholder="> filter conversations..." autocomplete="off" spellcheck="false" />
  </div>

  <!-- Controls -->
  <div class="mw-controls">
    <label class="mw-select-all">
      <input type="checkbox" id="select-all" />
      <span>ALL</span>
    </label>
    <div class="mw-speed-group">
      <button class="mw-speed-btn" data-speed="fast" title="50ms">F</button>
      <button class="mw-speed-btn mw-speed-active" data-speed="balanced" title="150ms">B</button>
      <button class="mw-speed-btn" data-speed="safe" title="300ms">S</button>
      <input type="range" id="delay-slider" min="50" max="400" value="150" title="Delay (ms)" />
      <span id="delay-value" class="mw-delay-val">150ms</span>
    </div>
  </div>

  <!-- Chat list -->
  <div id="chat-list" class="mw-chat-list">
    <p class="mw-empty-state">// awaiting scan</p>
  </div>

  <!-- Action buttons -->
  <div class="mw-actions">
    <button id="btn-export" class="mw-btn mw-btn--ghost" disabled>
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      EXPORT
    </button>
    <button id="btn-delete" class="mw-btn mw-btn--danger" disabled>
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
      </svg>
      DELETE
    </button>
  </div>

  <!-- Source code export -->
  <div class="mw-bottom-bar">
    <button id="btn-export-source" class="mw-btn mw-btn--code">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
      </svg>
      EXPORT PROGRAM SOURCE
    </button>
  </div>

  <!-- Progress overlay -->
  <div id="progress-overlay" class="mw-overlay mw-hidden">
    <div class="mw-overlay-content">
      <p id="progress-text">Processing...</p>
      <div class="mw-progress-track">
        <div id="progress-fill" class="mw-progress-fill"></div>
      </div>
      <p id="progress-detail" class="mw-progress-detail"></p>
      <button id="btn-cancel" class="mw-btn mw-btn--ghost mw-mt8">CANCEL</button>
    </div>
  </div>

  <!-- Undo toast -->
  <div id="undo-toast" class="mw-toast mw-hidden">
    <span id="undo-text">Done</span>
    <button id="btn-undo" class="mw-undo-btn">UNDO</button>
  </div>

  <!-- Footer -->
  <footer class="mw-footer">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2">
      <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <span>IRREVERSIBLE — EXPORT BACKUP BEFORE DELETING</span>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
